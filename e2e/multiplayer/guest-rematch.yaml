appId: com.anonymous.icallon
name: Guest follows the group into a rematch
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "GAME LOBBY"
    timeout: 30000
- assertVisible: ${ROOM_CODE}
- assertVisible: ${HOST_USERNAME}
- assertVisible: ${GUEST_USERNAME}
- assertVisible: "Waiting for host to start…"
- openLink: "icallon://game-lobby"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "home-resume-room"
    timeout: 15000
- tapOn:
    id: "home-resume-room"
- extendedWaitUntil:
    visible: "GAME LOBBY"
    timeout: 15000
- assertVisible: ${ROOM_CODE}
