appId: com.anonymous.icallon
name: Host starts an instant rematch
---
- launchApp:
    stopApp: false
- assertVisible:
    id: "leaderboard-rematch"
- tapOn:
    id: "leaderboard-rematch"
- extendedWaitUntil:
    visible: "GAME LOBBY"
    timeout: 30000
- assertVisible: ${ROOM_CODE}
- assertVisible: ${HOST_USERNAME}
- assertVisible: ${GUEST_USERNAME}
- assertVisible:
    id: "start-game-button"
- openLink: "icallon://game-lobby"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "home-profile"
    timeout: 15000
- tapOn:
    id: "home-profile"
- extendedWaitUntil:
    visible:
      id: "profile-history"
    timeout: 15000
- assertVisible: "Games: 1"
- tapOn:
    id: "profile-back"
- tapOn:
    id: "home-resume-room"
- extendedWaitUntil:
    visible: "GAME LOBBY"
    timeout: 15000
- assertVisible: ${ROOM_CODE}
