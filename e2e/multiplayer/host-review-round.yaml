appId: com.anonymous.icallon
name: Host reviews and confirms round
---
- launchApp:
    stopApp: false
- tapOn:
    id: "close-submissions-button"
- extendedWaitUntil:
    visible: "Review answers"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "40 points"
    direction: DOWN
- assertVisible: "40 points"
- scrollUntilVisible:
    element:
      id: "confirm-round-button"
    direction: DOWN
- tapOn:
    id: "confirm-round-button"
- extendedWaitUntil:
    visible: "Choose a letter"
    timeout: 30000
