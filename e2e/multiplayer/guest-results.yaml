appId: com.anonymous.icallon
name: Guest receives final leaderboard
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "leaderboard"
    timeout: 30000
- assertVisible:
    id: "leaderboard-confetti"
- assertVisible: "CHAMPION"
- assertVisible: ${GUEST_USERNAME}
- assertVisible: "120"
