appId: com.anonymous.icallon
name: Host completes final round
---
- launchApp:
    stopApp: false
- tapOn:
    id: "close-submissions-button"
- extendedWaitUntil:
    visible: "Review answers"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "40 points"
    direction: DOWN
- assertVisible: "40 points"
- scrollUntilVisible:
    element:
      id: "confirm-round-button"
    direction: DOWN
- tapOn:
    id: "confirm-round-button"
- extendedWaitUntil:
    visible:
      id: "leaderboard"
    timeout: 30000
- assertVisible:
    id: "leaderboard-confetti"
- assertVisible: "CHAMPION"
- assertVisible: ${GUEST_USERNAME}
- assertVisible: "120"
