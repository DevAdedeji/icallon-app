appId: com.anonymous.icallon
name: Protected room entry smoke test
---
- launchApp:
    stopApp: false
- openLink: "icallon://welcome"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible: "MULTIPLAYER WORD BATTLE"
- assertNotVisible: "Create Room"
- tapOn: "Join Room"
- assertVisible: "Sign in to your account to play"
- openLink: "icallon://invite?code=ABC234"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible: "YOU’RE INVITED"
- assertVisible: "ABC234"
- tapOn:
    id: "invite-login"
- assertVisible: "Sign in to your account to play"
